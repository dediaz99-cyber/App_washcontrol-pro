<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WASH CONTROL PRO - ESTÁNDAR</title>
    <link rel="icon" type="image/jpeg" href="head.jpg">
    <link rel="shortcut icon" type="image/jpeg" href="head.jpg">
    <link rel="apple-touch-icon" href="head.jpg">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { --bg-corporate: #1a2530; --brand-blue: #00469c; --success: #2b8a3e; --danger: #c92a2a; --light: #f8f9fa; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-corporate); color: #333; padding: 10px; padding-bottom: 40px; }
        .container { max-width: 500px; margin: 0 auto; }
        header { text-align: center; padding: 20px 0; color: white; font-weight: bold; font-size: 24px; letter-spacing: 1px; }
        .card { background: white; padding: 20px; border-radius: 16px; box-shadow: 0 6px 15px rgba(0,0,0,0.15); margin-bottom: 15px; }
        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #495057; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ced4da; border-radius: 8px; font-size: 15px; background-color: var(--light); outline: none; }
        input:focus, select:focus { border-color: var(--brand-blue); background-color: white; }
        .alert-box { background-color: #fff4e6; border: 1px dashed #fd7e14; border-radius: 8px; padding: 10px; margin-bottom: 15px; }
        .btn { width: 100%; padding: 15px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 12px; color: white; }
        .btn-primary { background-color: var(--brand-blue); }
        .btn-success { background-color: var(--success); }
        .btn-danger { background-color: var(--danger); opacity: 0.9; font-size: 13px; padding: 10px; }
        .btn-delete { background-color: var(--danger); padding: 6px 12px; font-size: 12px; border-radius: 6px; width: auto; margin: 0; }
        .record-item { background: white; padding: 12px; border-radius: 12px; margin-bottom: 8px; border-left: 6px solid var(--brand-blue); display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .record-info p { font-size: 13px; margin-bottom: 2px; color: #6c757d; }
        .badge-placa { background: #343a40; color: white; font-weight: bold; padding: 3px 8px; border-radius: 4px; font-size: 13px; display: inline-block; margin-bottom: 4px; }
        .record-val { text-align: right; font-weight: bold; font-size: 15px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
    </style>
</head>
<body>
<div class="container">
    <header>WASH CONTROL PRO</header>
    <div class="card">
        <form id="form-lavadero">
            <div class="form-group"><label>Placa del Vehículo</label><input type="text" id="placa" placeholder="EJ: XYZ123" required style="text-transform: uppercase;"></div>
            <div class="form-group"><label>Nombre del Cliente</label><input type="text" id="cliente" placeholder="Nombre del propietario" required></div>
            <div class="form-group"><label>Número de Celular</label><input type="tel" id="celular" placeholder="Ej: 3101234567" required></div>
            <div class="form-group">
                <label>Tipo de Vehículo</label>
                <select id="tipo-vehiculo" required onchange="cargarServicios()">
                    <option value="">Seleccione...</option>
                    <option value="Moto">Motocicleta / Moto</option>
                    <option value="Sedán">Automóvil Sedán</option>
                    <option value="Camioneta">Camioneta / SUV</option>
                    <option value="Van">Van</option>
                    <option value="Camión Pequeño">Camión Pequeño</option>
                    <option value="Camión Grande">Camión Grande</option>
                </select>
            </div>
            <div class="form-group"><label>Tipo de Servicio</label><select id="servicio" required onchange="asignarPrecio()"><option value="">Seleccione...</option></select></div>
            <div class="form-group"><label>Valor a Cancelar ($)</label><input type="number" id="valor" required></div>
            <div class="form-group"><label>Operario / Lavador Asignado</label><input type="text" id="operario" placeholder="Nombre del lavador" required></div>
            <div class="alert-box"><label style="color: #d9480f;">🛡️ Inventario / Objetos de Valor</label><input type="text" id="objetos-valor" placeholder="Ej: Gafas, maleta en baúl" required></div>
            <button type="button" class="btn btn-primary" onclick="registrarTurno()">Registrar Ingreso</button>
        </form>
    </div>
    <button class="btn btn-success" onclick="exportarExcelBasico()">📥 Descargar Reporte en Excel</button>
    <button class="btn btn-danger" onclick="reiniciarJornada()">⚠️ Reiniciar Jornada</button>
    <div class="card"><div id="lista-registros"></div></div>
</div>
<script>
    const tarifas = {
        "Moto": { "Enjuague": 20000, "Abajo": 30000, "Motor": 0, "De primera calidad": 45000 },
        "Sedán": { "Enjuague": 25000, "Abajo": 55000, "Motor": 80000, "De primera calidad": 135000 },
        "Camioneta": { "Enjuague": 35000, "Abajo": 65000, "Motor": 100000, "De primera calidad": 150000 },
        "Van": { "Enjuague": 45000, "Abajo": 75000, "Motor": 120000, "De primera calidad": 170000 },
        "Camión Pequeño": { "Enjuague": 60000, "Abajo": 85000, "Motor": 150000, "De primera calidad": 200000 },
        "Camión Grande": { "Enjuague": 80000, "Abajo": 100000, "Motor": 180000, "De primera calidad": 250000 }
    };
    let registros = JSON.parse(localStorage.getItem('datos_control_lavado_basico')) || [];

    function cargarServicios() {
        const tipo = document.getElementById('tipo-vehiculo').value;
        const select = document.getElementById('servicio');
        select.innerHTML = '<option value="">Seleccione...</option>';
        if(tipo && tarifas[tipo]) {
            for(let s in tarifas[tipo]) {
                let o = document.createElement('option'); o.value = s; o.textContent = (tipo === "Moto" && s === "Motor") ? "Motor (N/A)" : s; select.appendChild(o);
            }
        }
        document.getElementById('valor').value = '';
    }
    function asignarPrecio() {
        const t = document.getElementById('tipo-vehiculo').value; const s = document.getElementById('servicio').value;
        if(t && s && tarifas[t]) { if(t === "Moto" && s === "Motor") { document.getElementById('valor').value = 0; alert("No disponible."); } else { document.getElementById('valor').value = tarifas[t][s]; } }
    }
    function registrarTurno() {
        if(!document.getElementById('form-lavadero').checkValidity()) { alert("Complete los campos."); return; }
        const ahora = new Date();
        const rTiempo = `${String(ahora.getDate()).padStart(2,'0')}/${String(ahora.getMonth()+1).padStart(2,'0')}/${ahora.getFullYear()} - ${ahora.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', hour12: true})}`;
        
        registros.push({
            turno: registros.length + 1, hora: rTiempo, placa: document.getElementById('placa').value.toUpperCase().replace(/\s+/g, ''),
            cliente: document.getElementById('cliente').value, celular: document.getElementById('celular').value,
            tipoVehiculo: document.getElementById('tipo-vehiculo').value, servicio: document.getElementById('servicio').value,
            valor: parseFloat(document.getElementById('valor').value), operario: document.getElementById('operario').value, objetosValor: document.getElementById('objetos-valor').value
        });
        localStorage.setItem('datos_control_lavado_basico', JSON.stringify(registros));
        document.getElementById('form-lavadero').reset();
        document.getElementById('servicio').innerHTML = '<option value="">Seleccione...</option>';
        actualizarInterfaz();
    }
    function eliminarRegistro(idx) { if(confirm("¿Eliminar?")) { registros.splice(idx, 1); registros.forEach((r, i) => r.turno = i + 1); localStorage.setItem('datos_control_lavado_basico', JSON.stringify(registros)); actualizarInterfaz(); } }
    function reiniciarJornada() { if(confirm("¿Reiniciar?")) { registros = []; localStorage.removeItem('datos_control_lavado_basico'); actualizarInterfaz(); } }
    function actualizarInterfaz() {
        const lista = document.getElementById('lista-registros'); lista.innerHTML = '';
        registros.forEach((reg, i) => {
            const item = document.createElement('div'); item.className = 'record-item';
            item.innerHTML = `<div class="record-info"><span class="badge-placa">${reg.placa}</span><p><strong>${reg.servicio}</strong></p><p>🕒 ${reg.hora} | 👷 ${reg.operario}</p></div><div class="record-val"><span>$${reg.valor.toLocaleString()}</span><button class="btn btn-delete" onclick="eliminarRegistro(${i})">X</button></div>`;
            lista.appendChild(item);
        });
    }
    function exportarExcelBasico() {
        if(registros.length === 0) return;
        const data = registros.map(r => [r.turno, r.hora, r.placa, r.cliente, r.celular, r.tipoVehiculo, r.servicio, r.valor, r.operario, r.objetosValor]);
        data.unshift(["Turno", "Fecha y Hora Ingreso", "Placa", "Cliente", "Celular", "Tipo de Vehículo", "Servicio Solicitado", "Valor Pagado ($)", "Lavador Asignado", "Inventario / Objetos Valor"]);
        const ws = XLSX.utils.aoa_to_sheet(data); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Jornada");
        XLSX.writeFile(wb, `Reporte_Estandar_${new Date().toISOString().slice(0,10)}.xlsx`);
    }
    actualizarInterfaz();
</script>
</body>
</html>
